<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- JS -->
    <script defer src="./js/nuevomain.js"></script>
    <title>Mi primer script interactivo</title>
</head>
<body>
    <h1>Mi tienda online</h1>
    <div class="contenedor">
        <label for="id">ID:</label>
        <input type="number" id="id" placeholder="Ej: 1">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Ej: Remera">
        <label for="precio">Precio:</label>
        <input type="number" id="precio" placeholder="Ej: 10000">
        <label for="categoria">Categoria:</label>
        <input type="text" id="categoria" placeholder="Ej: Indumentaria">
        <button type="button" id="agregar">Agregar</button>
    </div>

    <section class="cuerpo">
        <h2 class="subtitulo-cuerpo">Productos Disponibles</h2>
        <div id="productosDisponibles"></div>
        
        <h2 class="subtitulo-cuerpo">Carrito</h2>
        <div id="carrito"></div>
    </section>
</body>
</html>
